# Eval gate: blocks changes that make retrieval or abstention worse.
#
# Runs the golden-set eval with the default config (dense) and compares it with the
# committed eval/baseline.json. Fails if any gated metric drops beyond its tolerance
# (see GATES in eval/compare.py). The markdown diff goes to the job summary and, on a
# pull request, to a sticky PR comment.
#
# Speed: the built index (and the react.dev checkout) is cached. Every run restores the
# newest cache and runs an incremental `codesearch ingest`, which embeds only new or
# changed chunks: usually 0, so the step takes seconds. The bge model is cached too.
#
# To accept a deliberate change in the numbers: run the eval locally, then
#   uv run python -m eval.compare results/dense.json --update-baseline
# and commit eval/baseline.json with the change.
name: eval-gate

on:
  pull_request:
    branches: [main]
    paths:
      - "codesearch/**"
      - "eval/**"
      - "prompts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"
  push:
    branches: [v2]
    paths:
      - "codesearch/**"
      - "eval/**"
      - "prompts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # sticky PR comment

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Golden-set eval vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv with Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('codesearch/config.py') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Restore index and corpus cache
        uses: actions/cache@v4
        with:
          path: |
            index
            data
          # New key whenever anything that shapes the chunks or vectors changes;
          # restore-keys falls back to the newest older index, which ingest updates.
          key: index-${{ runner.os }}-${{ hashFiles('codesearch/config.py', 'codesearch/ingest/**', 'codesearch/index/**') }}
          restore-keys: index-${{ runner.os }}-

      - name: Build or update the index (incremental)
        run: uv run codesearch ingest

      - name: Run the golden-set eval (dense, the default config)
        run: uv run python -m eval.run_eval eval/configs/dense.yaml --no-mlflow

      - name: Compare with the baseline
        id: gate
        run: |
          set +e
          uv run python -m eval.compare results/dense.json --report results/gate.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write the report to the job summary
        if: always()
        run: |
          if [ -f results/gate.md ]; then
            { echo "## Eval gate"; echo; cat results/gate.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('results/gate.md') != ''
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: eval-gate
          path: results/gate.md

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
          if-no-files-found: ignore

      - name: Fail if the gate failed
        if: steps.gate.outputs.exit_code != '0'
        run: |
          echo "Eval gate failed (exit ${{ steps.gate.outputs.exit_code }}): see the report above."
          exit 1
