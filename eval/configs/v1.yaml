# Baseline: reproduces how v1 retrieved, with today's embedder (bge-small).
#   - v1 chunking: blind 1,000-character cuts, no header path, no anchors
#   - dense search only, top 3 (v1 sent 3 chunks to the LLM)
# Needs its own index: build it with
#   CODESEARCH_INDEX__CHUNK_STRATEGY=v1 CODESEARCH_INDEX__INDEX_DIR=index/v1 uv run codesearch ingest
# Compare v1 against v2 at PAGE level (page_* metrics): v1 chunks have no anchors.
name: v1
description: v1-style chunking + dense top-3 (baseline)
overrides:
  index:
    chunk_strategy: v1
    index_dir: index/v1
  retrieval:
    mode: dense
    dense_k: 3
