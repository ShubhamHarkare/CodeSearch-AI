# Prometheus for the local / single-VM stack (see deploy/docker-compose.yml).
# It pulls GET /metrics from the API every 15 s and evaluates alerts.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: codesearch-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]  # the compose service name, not localhost
