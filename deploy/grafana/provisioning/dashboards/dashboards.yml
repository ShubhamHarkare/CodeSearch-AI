# Loads every JSON file in /var/lib/grafana/dashboards (mounted from deploy/grafana/dashboards).
apiVersion: 1
providers:
  - name: codesearch
    folder: CodeSearch
    type: file
    allowUiUpdates: true  # edit in the UI, then export the JSON back into the repo
    options:
      path: /var/lib/grafana/dashboards
