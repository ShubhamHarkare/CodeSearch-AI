# TODO(v2): the top-level 'version' key is obsolete in Compose v2; drop it.
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codesearch-redis
    ports:
      # TODO(v2): publishes Redis on the host with no password; only needed for local dev.
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
    driver: local
